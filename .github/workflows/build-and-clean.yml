name: Build and Clean

on:
  push:
    branches: ["**"]

env:
  Cleaned: ${{ startsWith(github.event.head_commit.message, 'Cleaned:') }}

jobs:
  build:
    runs-on: ubuntu-22.04
    container: wpilib/roborio-cross-ubuntu:2024-22.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Spotless Apply
        if: ${{ !startsWith(github.event.head_commit.message, 'Cleaned:') }}
        run: ./gradlew spotlessApply
      - name: Commit
        id: commit
        if: ${{ !startsWith(github.event.head_commit.message, 'Cleaned:') }}
        continue-on-error: true
        run: |
          git config --global user.name "gh-commiter[bot]"
          git config --global user.email 192268280+gh-commiter[bot]@users.noreply.github.com
          git add .
          git commit -m "Cleaned: '${{ github.event.head_commit.message }}'"
      - name: Push
        if: ${{ steps.commit.outcome == 'success' }}
        run: git push --force
      - name: Build
        if: ${{ startsWith(github.event.head_commit.message, 'Cleaned:') }}
        if: ${{ steps.commit.outcome != 'success' }}
        run: ./gradlew build



